<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha-X — Téléchargeur Vidéo & Audio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 4L10 14L4 28L12 22L16 30L20 22L28 28L22 14L26 4L18 12L16 6L14 12L6 4Z' fill='%2306B6D4' opacity='0.9'/%3E%3Ccircle cx='12' cy='16' r='1.5' fill='%23020617'/%3E%3Ccircle cx='20' cy='16' r='1.5' fill='%23020617'/%3E%3Cpath d='M14 20L16 22L18 20' stroke='%23020617' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#06B6D4',
                        secondary: '#22D3EE',
                        cta: '#10B981',
                        surface: '#020617',
                        card: 'rgba(255,255,255,0.06)',
                        ink: '#F8FAFC',
                        muted: '#94A3B8',
                        border: 'rgba(255,255,255,0.12)',
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        body: ['Work Sans', 'sans-serif'],
                    },
                    backdropBlur: {
                        glass: '16px',
                    },
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Work Sans', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }

        body {
            background: #020617;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(6,182,212,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(16,185,129,0.08) 0%, transparent 50%);
            min-height: 100vh;
        }

        .glass {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .glass-strong {
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.18);
        }

        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.5s ease-out both; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }

        @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(6,182,212,0.15); } 50% { box-shadow: 0 0 30px rgba(6,182,212,0.25); } }
        .animate-glow { animation: glow 3s ease-in-out infinite; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        input:focus-visible, button:focus-visible, a:focus-visible {
            outline: 2px solid #06B6D4;
            outline-offset: 2px;
        }

        input::placeholder { color: rgba(148,163,184,0.4); }
    </style>
</head>
<body class="text-ink">
    {% block content %}{% endblock %}

    <script>
    function formatSize(bytes) {
        if (!bytes) return '';
        const units = ['o', 'Ko', 'Mo', 'Go'];
        let i = 0, size = bytes;
        while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
        return size.toFixed(1) + ' ' + units[i];
    }
    function formatSpeed(b) { return b ? formatSize(b) + '/s' : ''; }

    let currentTask = null;
    let pollInterval = null;

    async function startDownload() {
        const url = document.getElementById('url-input').value.trim();
        const fmt = document.querySelector('input[name="format"]:checked').value;
        const quality = document.querySelector('input[name="quality"]:checked').value;

        if (!url) { showError('Entrez un lien'); return; }
        if (!url.startsWith('http')) { showError('Lien invalide (commence par http/https)'); return; }

        hideError();
        showProgress();
        updateProgress(0, 'Préparation...');

        try {
            const res = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, format: fmt, quality }),
            });
            const data = await res.json();
            if (data.error) { showError(data.error); hideProgress(); return; }
            currentTask = data.task_id;
            pollInterval = setInterval(pollStatus, 500);
        } catch (e) {
            showError('Erreur de connexion');
            hideProgress();
        }
    }

    async function pollStatus() {
        if (!currentTask) return;
        try {
            const res = await fetch('/api/status/' + currentTask);
            const data = await res.json();
            if (data.state === 'downloading') {
                const pct = data.progress || 0;
                let info = pct.toFixed(1) + '%';
                if (data.speed) info += ' — ' + formatSpeed(data.speed);
                if (data.eta != null) info += ' — reste ' + data.eta + 's';
                updateProgress(pct, info);
            } else if (data.state === 'processing') {
                updateProgress(100, 'Conversion en cours...');
            } else if (data.state === 'done') {
                clearInterval(pollInterval);
                showDone(data.title, currentTask);
            } else if (data.state === 'error') {
                clearInterval(pollInterval);
                showError(data.error || 'Erreur inconnue');
                hideProgress();
            }
        } catch (e) {
            clearInterval(pollInterval);
            showError('Erreur de connexion');
            hideProgress();
        }
    }

    function updateProgress(pct, text) {
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('progress-label').textContent = text;
    }
    function showProgress() {
        document.getElementById('progress-section').classList.remove('hidden');
        document.getElementById('done-section').classList.add('hidden');
        document.getElementById('error-section').classList.add('hidden');
        document.getElementById('btn-download').disabled = true;
        document.getElementById('btn-download').classList.add('opacity-40', 'cursor-not-allowed');
    }
    function hideProgress() {
        document.getElementById('progress-section').classList.add('hidden');
        document.getElementById('btn-download').disabled = false;
        document.getElementById('btn-download').classList.remove('opacity-40', 'cursor-not-allowed');
    }
    function showDone(title, taskId) {
        document.getElementById('progress-section').classList.add('hidden');
        document.getElementById('done-section').classList.remove('hidden');
        document.getElementById('error-section').classList.add('hidden');
        document.getElementById('done-title').textContent = title;
        document.getElementById('btn-download').disabled = false;
        document.getElementById('btn-download').classList.remove('opacity-40', 'cursor-not-allowed');
        document.getElementById('btn-download-file').href = '/api/file/' + taskId;
    }
    function showError(msg) {
        document.getElementById('error-section').classList.remove('hidden');
        document.getElementById('error-msg').textContent = msg;
    }
    function hideError() { document.getElementById('error-section').classList.add('hidden'); }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && document.activeElement.id === 'url-input') startDownload();
    });
    </script>
</body>
</html>
